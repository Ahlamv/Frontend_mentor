<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body{
      margin: 0;
      background-color: hsl(30, 38%, 92%);
      font-family: 'Montserrat', sans-serif;
    }
    .container{
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: hsl(0, 0%, 100%);
      width: 343px;
      margin: 16px auto;
      overflow: hidden;
      border-radius: 16px;
    }
    .img > img{
      width: 100%;
      height: auto;
      display: block;
    }
    .perfume{
      font-size:12px;
    }
    .title{
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 800;
    }
    .des{
      font-size: 16px;
    }
    .price .main{
      font-family: 'Fraunces', serif;
      color:  hsl(158, 36%, 37%);
      font-size: 24px;
      font-weight: 800;
    }
    .price .calc{
      font-size: 12px;
       text-decoration: line-through;
    }
    .description{
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
    }
    .price{
      display: flex;
      flex-direction: row;
      gap: 4px;
      align-items: center;
    }
    .button{
      color: white;
      background-color: hsl(158, 36%, 37%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 24px;
      border-radius: 8px;
      gap: 6px;
    }
    .icon img{
      width: 16px;
      height: 16px;
    }
    .add{
      font-weight: 500;
    }
    @media (min-width:768px){
      body{
        min-height: 100vh;
        display: flex;
        align-items: center;
      }
      .container{
        display: flex;
        flex-direction: row;
        width: 600px;
        height: 450px;
        margin: auto;
      }
      .img{
        width: 50%;
        height: 100%;
      }
      .img > img{
        height: 100%;
        object-fit: cover;
      }
      .description{
        width: 50%;
        padding: 16px;
        justify-content: center;
      }
      .button:hover{
        background-color:  hsl(158, 42%, 18%);
        cursor: pointer;

    }
      
    }

  </style>
</head>
<body>
  <div class="container">
    <picture class="img">
      <source media="(min-width: 768px)" srcset="./images/image-product-desktop.jpg">
      <img src="./images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum">
    </picture>
    <div class="description">
      <div class="perfume">PERFUME</div>
      <div class="title">Gabrielle Essence Eau De Parfum</div>
      <div class="des">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</div>
      <div class="price">
        <div class="main">$149.99</div>
        <div class="calc">$169.99</div></div>
      <div class="button"><div class="icon"> <img src="./images/icon-cart.svg"></div>
        <div class="add">Add to Cart</div>
      </div>
    </div>
  </div>
</body>
</html>
