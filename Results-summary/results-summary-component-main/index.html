<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      background:  hsl(221, 100%, 96%);

    }
    .container{
      width:100%;
      margin: auto;

    }
    .result{
      align-items: center;
      background: linear-gradient(to bottom,hsl(252, 100%, 67%),  hsl(241, 81%, 54%));
      width:100%;
      display: flex;
      flex-direction:column;
      gap: 24px;
      padding: 32px;
      box-sizing: border-box;
      color: white;
      border-radius: 0px 0px 24px 24px;
    }
    .title{
      font-size: 16px;
      font-weight: 400;
    }
    .circle{
      display: flex;
      flex-direction: column;
      background: linear-gradient(to top, hsla(241, 72%, 46%, 0), hsla(256, 72%, 46%, 1));
      width: 100px;
      height: 100px;
      border-radius: 50%;
      padding: 12px;
      align-items: center;
      text-align: center;
      justify-content: center;
    }
    .circle .high{
      font-size: 40px;
      font-weight: 800;
    }
    .circle .low{
      font-size: 16px;
      font-weight: 200;
    }
    .des{
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      text-align: center;
    }
    .des .desc{
      font-size: 24px;
      font-weight: 500;
    }
    .des .subdesc{
      font-size: 16px;
      font-weight: 200;
    }
    .summary{
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin:24px;
    }
    .summary .sum{
      font-size: 24px;
      font-weight: 400;
    }
    .reaction, .memory, .verbal, .visual{
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      padding: 12px;
      border-radius: 8px;
    }
    .sub-con{
      display: flex;
      flex-direction: row;
      gap: 6px;
    }
    .icon {
      display: flex;
      width: 20px;
      height: 20px;
    }

    .button{
      text-align:center;
      background-color:hsl(224, 30%, 27%);
      color:white;
      font-size:16px;
      padding:16px 42px;
      border-radius: 24px;
    }
    .button:hover{
      background: linear-gradient(to top, hsla(241, 72%, 46%, 0), hsla(256, 72%, 46%, 1));
      cursor: pointer;
    }
    .output{
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .reaction{
      background-color: hsla(0, 100%, 67%, 0.1);
    }
    .reaction .sub-con{
      color: hsl(0, 100%, 67%);
    }
    .memory{
      background-color: hsla(39, 100%, 56%, 0.1);
    }
    .memory .sub-con{
      color: hsl(39, 100%, 56%);
    }
    .verbal{
      background-color: hsla(166, 100%, 37%, 0.1);
    }
    .verbal .sub-con{
      color: hsl(166, 100%, 37%);
    }
    .visual{
      background-color: hsla(234, 85%, 45%, 0.1);
    }
    .visual .sub-con{
      color: hsl(234, 85%, 45%);
    }
    @media (min-width: 768px){
      body{
        min-height: 100vh;
      }
      .container{
        background-color: hsl(0, 0%, 100%);
        max-width: 736px;
        display: flex;
        flex-direction: row;
        margin: auto;
        border-radius: 24px;
        overflow: hidden; 
     }
      .result{
        width: 50%;
        border-radius: 24px 0 0 24px;
      }
      .summary{
        width: 50%;
      }
      .button:hover {
       background: linear-gradient(to bottom,hsl(252, 100%, 67%),  hsl(241, 81%, 54%));
       cursor: pointer;
    }
  }
    


  </style>
</head>
<body>
  <div class="container">
    <div class="result">
      <div class="title">Your Result</div>
      <div class="circle"><div class="high">76</div>
      <div class="low">of 100</div>
    </div>
    <div class="des">
      <div class="desc">Great</div>
     <div class="subdesc">You scored higher than 65% of the people who have taken these tests.</div></div></div>
    <div class="summary">
      <div class="sum">Summary</div>
      <div class="output">
        <div class="reaction">
          <div class="sub-con">
            <div class="icon"><img src="./assets/images/icon-reaction.svg" alt=""></div>
            <div class="name">Reaction</div>
          </div>
          <div class="numeric">80 / 100</div>
        </div>
        <div class="memory">
        <div class="sub-con">
            <div class="icon"><img src="./assets/images/icon-memory.svg" alt=""></div>
            <div class="name">Memory</div>
          </div>
          <div class="numeric">80 / 100</div>
        </div>
        <div class="verbal">
        <div class="sub-con">
            <div class="icon"><img src="./assets/images/icon-verbal.svg" alt=""></div>
            <div class="name">Verbal</div>
          </div>
          <div class="numeric">80 / 100</div>
        </div>
        <div class="visual">
        <div class="sub-con">
            <div class="icon"><img src="./assets/images/icon-visual.svg" alt=""></div>
            <div class="name">Visual</div>
          </div>
          <div class="numeric">80 / 100</div>
        </div>
        
      <div class="button">Continue</div>
    </div>

  </div>
</body>
</html>
