<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body{
      font-family: "Outfit", sans-serif ;
      background-color: hsl(212, 45%, 89%);
      margin: 0;
    }
    .container{
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      
    } 
    .card{
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 320px;
      height:499px;
      gap: 24px;
      padding: 16px 16px 40px 16px;
      box-sizing: border-box;
      background-color: white;
      border-radius: 20px;
    }
    .qr-code{
      width: 288px;
    }
    .qr-code-image{
      width: 100%;
      display:block;
      border-radius: 10px;
    }
    .description{
      display: flex;
      flex-direction: column;
      padding: 0px 10px 0px 16px;
      gap: 16px;
    }
    .description .title{
      font-size: 22px;
      color: hsl(218, 44%, 22%);
      font-weight: bold;

    }
    .description .desc{
      font-size: 15px;
      color: hsl(216, 15%, 48%);
    }

  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="qr-code">
      <img src="./images/image-qr-code.png" alt="QrCode" class="qr-code-image">
    </div>
    <div class="description">
      <div class="title">Improve your front-end skills by building projects</div>
      <div class="desc">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</div>
    </div>
  </div>

</div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Ahlam</a>.
  </footer>
</body>
</html>
